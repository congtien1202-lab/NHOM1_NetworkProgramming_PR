# Cấu hình mặc định của Server. Tham số dòng lệnh (--port=5000 ...) ghi đè các giá trị này.
port=5000
# fake = detector giả (2 đối tượng cố định); djl = mô hình thật
detector=fake
# (tùy chọn) model=<file.onnx>: dùng mô hình khác thay cho mô hình đóng trong jar; synset.txt phải nằm cạnh
# false khi chạy trên máy không màn hình (VPS)
gui=true
maxClients=20
